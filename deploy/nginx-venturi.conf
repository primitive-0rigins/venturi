# Reference only: terminate TLS here; keep Venturi and Phoenix on loopback.
server {
  listen 443 ssl http2;
  server_name venturi.example.org;
  ssl_certificate /etc/letsencrypt/live/venturi.example.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/venturi.example.org/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location / { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
