[package]
name = "venturi"
version = "0.1.0"
edition = "2021"
description = "Local, encrypted, governed memory infrastructure for AI agents"
license = "MIT"

[[bin]]
name = "venturi"
path = "src/main.rs"

[lib]
name = "venturi"
path = "src/lib.rs"

[dependencies]
sha2             = "0.10"
chacha20poly1305 = { version = "0.10", features = ["std"] }
zstd             = "0.13"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
thiserror        = "1"
rand             = "0.8"
rusqlite         = { version = "0.31", features = ["bundled", "load_extension"] }
uuid             = { version = "1", features = ["v4"] }
# Use the platform trust store for optional HTTPS model endpoints. This avoids
# bundling the CDLA-licensed webpki-roots data through ureq's default feature.
ureq             = { version = "2", default-features = false, features = ["json", "native-tls"] }
axum             = "0.7"
tokio            = { version = "1", features = ["full"] }
tower-http       = { version = "0.5", features = ["trace"] }
nalgebra         = "0.33"
futures-util     = "0.3"

[dev-dependencies]
tempfile = "=3.10.1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
